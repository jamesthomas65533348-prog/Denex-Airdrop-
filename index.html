<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Denex</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000000;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      height: 80vw;
      max-width: 500px;
      max-height: 500px;
      background-image: url('/denex-tap.png'), url('./denex-tap.png'), url('./Denex-tap.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.03;
      filter: blur(2px);
      z-index: 0;
    }
    
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(0, 153, 255, 0.15) 0%, transparent 50%),
                  linear-gradient(180deg, #0a1929 0%, #000000 100%);
      z-index: 0;
    }
    
   .header,.content,.energy-section,.popup {
      position: relative;
      z-index: 1;
    }
    
   .header {
      padding: 12px 20px 0;
      margin-top: 0;
    }
   .island {
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-radius: 25px;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
   .island-tabs {
      display: flex;
      gap: 4px;
    }
   .island-tab {
      padding: 8px 14px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      opacity: 0.5;
    }
   .island-tab.active {
      background: rgba(0, 212, 255, 0.2);
      opacity: 1;
      color: #00d4ff;
    }
   .balance {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      padding: 8px 14px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.15);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }
   .dtk-icon {
      width: 16px;
      height: 16px;
    }
    
   .content {
      height: calc(100vh - 160px);
      overflow-y: auto;
      padding: 20px;
    }
   .page {
      display: none;
      animation: fadeIn 0.3s ease;
    }
   .page.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
   .tap-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
   .tap-wrapper {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
   .tap-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #00d4ff, #0099ff, #00d4ff);
      animation: rotate 3s linear infinite;
      padding: 3px;
    }
    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
   .tap-image {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.1s ease;
      position: relative;
      z-index: 2;
      background: #0a1929;
      touch-action: none;
    }
   .tap-image:active {
      transform: scale(0.92);
    }
   .tap-bounce {
      animation: bounce 0.3s ease;
    }
    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(0.9); }
      60% { transform: scale(1.05); }
    }
   .tap-text {
      margin-top: 24px;
      font-size: 16px;
      opacity: 0.6;
      letter-spacing: 0.5px;
    }
    
   .card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
   .card-title {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 8px;
    }
   .card-value {
      font-size: 28px;
      font-weight: 700;
      color: #00d4ff;
    }
   .ref-link {
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.3);
      padding: 12px;
      border-radius: 12px;
      font-size: 12px;
      word-break: break-all;
      margin: 12px 0;
    }
   .copy-btn {
      background: #00d4ff;
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      width: 100%;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    
   .leader-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
   .leader-rank {
      width: 30px;
      font-weight: 700;
      color: #00d4ff;
    }
   .leader-name {
      flex: 1;
      font-size: 15px;
    }
   .leader-bal {
      font-weight: 600;
    }
   .you-badge {
      background: rgba(0, 212, 255, 0.2);
      color: #00d4ff;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      margin-left: 8px;
    }
    
   .empty-state {
      text-align: center;
      padding: 60px 20px;
      opacity: 0.5;
    }
   .empty-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 16px;
      opacity: 0.3;
    }
    
   .energy-section {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.9) 100%);
    }
   .energy-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
    }
   .energy-bar {
      background: rgba(255,255,255,0.08);
      height: 10px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }
   .energy-fill {
      background: linear-gradient(90deg, #00d4ff 0%, #0099ff 100%);
      height: 100%;
      border-radius: 10px;
      transition: width 0.4s ease;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.7);
    }
   .refill-btn {
      background: rgba(0, 212, 255, 0.15);
      border: 1px solid rgba(0, 212, 255, 0.5);
      color: #00d4ff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    
   .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(30,30,30,0.7);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 18px 28px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 999;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      font-weight: 500;
      max-width: 80%;
      text-align: center;
    }
   .popup.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    
   .float-text {
      position: absolute;
      color: #00ff88;
      font-weight: 700;
      font-size: 28px;
      pointer-events: none;
      animation: floatUp 1s ease-out forwards;
      text-shadow: 0 0 15px rgba(0, 255, 136, 0.9);
      z-index: 10;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-100px) scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="island">
      <div class="island-tabs">
        <div class="island-tab active" data-page="mine">Mine</div>
        <div class="island-tab" data-page="refs">Refs</div>
        <div class="island-tab" data-page="board">Board</div>
        <div class="island-tab" data-page="tasks">Tasks</div>
      </div>
      <div class="balance">
        <svg class="dtk-icon" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#00d4ff"/>
          <path d="M2 17L12 22L22 17M2 12L12 17L22 12" stroke="#00d4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="dtkBalance">0</span>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="page active" id="mine">
      <div class="tap-container">
        <div class="tap-wrapper">
          <div class="tap-ring"></div>
          <img src="/denex-tap.png" class="tap-image" id="tapImage" alt="Tap Denex" onerror="this.src='./denex-tap.png'; this.onerror=function(){this.src='./Denex-tap.png'}">
        </div>
        <div class="tap-text">Tap to mine DTK</div>
      </div>
    </div>

    <div class="page" id="refs">
      <div class="card">
        <div class="card-title">Total Referrals</div>
        <div class="card-value" id="refCount">0</div>
      </div>
      <div class="card">
        <div class="card-title">Referral Earnings</div>
        <div class="card-value" id="refEarned">0 DTK</div>
      </div>
      <div class="card">
        <div class="card-title">Your Invite Link</div>
        <div class="ref-link" id="refLink">Loading...</div>
        <button class="copy-btn" onclick="copyRef()">Copy Link</button>
      </div>
      <div class="card-title" style="margin-top: 24px; margin-bottom: 12px;">Recent Referrals</div>
      <div id="refList"></div>
    </div>

    <div class="page" id="board">
      <div class="card-title" style="margin-bottom: 16px;">Top Miners</div>
      <div id="leaderList"></div>
    </div>

    <div class="page" id="tasks">
      <div class="empty-state">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        <div style="font-size: 16px; margin-bottom: 8px;">No available tasks yet</div>
        <div style="font-size: 14px; opacity: 0.5;">Come back later</div>
      </div>
    </div>
  </div>

  <div class="energy-section">
    <div class="energy-top">
      <span id="energyText">Energy: 100/100</span>
      <button class="refill-btn" id="refillBtn" onclick="buyRefill()" style="display:none;">Refill 500 DTK</button>
    </div>
    <div class="energy-bar">
      <div class="energy-fill" id="energyFill" style="width: 100%"></div>
    </div>
  </div>

  <div class="popup" id="popup"></div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();
  tg.ready();
  tg.setHeaderColor('#000000');
  tg.setBackgroundColor('#000000');
  tg.enableClosingConfirmation();

  const supabaseUrl = 'https://qdxaotqmbrbmwqqbuffy.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkeGFvdHFtYnJibXdxcWJ1ZmZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3MDU2NTMsImV4cCI6MjA5OTI4MTY1M30.zbtpZNfLPpm8s7uMD9djXX61qAO6_fCe-hk2HDNGe1I';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);
  
  let user = tg.initDataUnsafe.user;
  let userData = null;
  let canTap = true;
  let lastTapTime = 0;

  // TAB SWITCHING
  document.querySelectorAll('.island-tab').forEach(tab => {
    tab.addEventListener('click', (e) => {
      e.preventDefault();
      const page = tab.dataset.page;
      
      document.querySelectorAll('.island-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(page).classList.add('active');
      
      if (page === 'refs') loadRefs();
      if (page === 'board') loadBoard();
      
      tg.HapticFeedback.impactOccurred('light');
    });
  });

  async function init() {
    if (!user) {
      showPopup('Open in Telegram');
      return;
    }

    await checkEnergyRefill();

    const { data: existingUser, error } = await sb
.from('users')
.select('*')
.eq('id', user.id)
.single();

    if (error && error.code === 'PGRST116') {
      const startParam = tg.initDataUnsafe.start_param;
      let referrerId = null;
      if (startParam && startParam.startsWith('ref_')) {
        referrerId = parseInt(startParam.split('_')[1]);
      }

      const { data: newUser, error: insertErr } = await sb
.from('users')
.insert({
          id: user.id,
          username: user.username,
          first_name: user.first_name,
          referred_by: referrerId
        })
.select()
.single();
      
      if (insertErr) {
        showPopup('DB Error');
        return;
      }
      
      userData = newUser;

      if (referrerId && referrerId!== user.id) {
        await sb.rpc('pay_referral', { referrer: referrerId, referred: user.id });
        showPopup('+700 DTK Welcome Bonus!');
      }
    } else if (error) {
      showPopup('DB Error');
      return;
    } else {
      userData = existingUser;
    }

    updateUI();
    setInterval(checkEnergyRefill, 60000);
  }

  async function checkEnergyRefill() {
    if (!userData) return;
    const now = new Date();
    const lastRefill = new Date(userData.last_energy_refill);
    const diff = now - lastRefill;
    
    if (diff >= 25200000 && userData.energy < 100) {
      const { data } = await sb
.from('users')
.update({ energy: 100, last_energy_refill: now.toISOString() })
.eq('id', user.id)
.select()
.single();
      userData = data;
      updateUI();
      showPopup('Energy Refilled!');
    }
  }

  // MULTI-TOUCH SUPPORT: Up to 4 fingers
  document.getElementById('tapImage').addEventListener('touchstart', async (e) => {
    e.preventDefault();
    
    if (!canTap ||!userData) return;
    
    const now = Date.now();
    if (now - lastTapTime < 100) return; // 100ms cooldown
    lastTapTime = now;
    
    // Get number of touches, max 4
    const touchCount = Math.min(e.touches.length, 4);
    const energyCost = touchCount;
    
    if (userData.energy < energyCost) {
      tg.HapticFeedback.notificationOccurred('error');
      showPopup(`Need ${energyCost} Energy!`);
      return;
    }

    canTap = false;
    tg.HapticFeedback.impactOccurred('medium');
    
    const img = e.target;
    img.classList.add('tap-bounce');
    setTimeout(() => img.classList.remove('tap-bounce'), 300);

    // Show float text for each finger
    for (let i = 0; i < touchCount; i++) {
      const touch = e.touches[i];
      showFloatText(touch.clientX, touch.clientY);
    }

    const newEnergy = userData.energy - energyCost;
    const newBalance = userData.dtk_balance + (70 * touchCount);
    
    const { data, error } = await sb
.from('users')
.update({ 
        energy: newEnergy, 
        dtk_balance: newBalance,
        last_tap: new Date().toISOString()
      })
.eq('id', user.id)
.select()
.single();

    if (error) {
      showPopup('Error');
      canTap = true;
      return;
    }

    userData = data;
    updateUI();
    setTimeout(() => canTap = true, 100);
  });

  async function buyRefill() {
    if (userData.dtk_balance < 500) {
      showPopup('Need 500 DTK');
      tg.HapticFeedback.notificationOccurred('error');
      return;
    }
    
    const { data, error } = await sb
.from('users')
.update({ 
        energy: 100, 
        dtk_balance: userData.dtk_balance - 500,
        last_energy_refill: new Date().toISOString()
      })
.eq('id', user.id)
.select()
.single();
    
    if (error) {
      showPopup('Error');
      return;
    }
    
    userData = data;
    updateUI();
    tg.HapticFeedback.notificationOccurred('success');
    showPopup('Energy Refilled!');
  }

  async function loadRefs() {
    const { data: refs, error } = await sb
.from('referrals')
.select('*, referred:users!referrals_referred_id_fkey(first_name)')
.eq('referrer_id', user.id)
.order('created_at', { ascending: false })
.limit(10);
    
    if (error) return;
    
    const { count } = await sb
.from('referrals')
.select('*', { count: 'exact', head: true })
.eq('referrer_id', user.id);
    
    document.getElementById('refCount').innerText = count || 0;
    document.getElementById('refEarned').innerText = ((count || 0) * 500).toLocaleString() + ' DTK';
    document.getElementById('refLink').innerText = `https://t.me/Denex_airdrop_bot/Denex?startapp=ref_${user.id}`;
    
    const list = document.getElementById('refList');
    list.innerHTML = refs?.length? refs.map(r => `
      <div class="leader-item">
        <div class="leader-name">${r.referred.first_name || 'User'}</div>
        <div class="leader-bal" style="color: #00ff88;">+500 DTK</div>
      </div>
    `).join('') : '<div style="opacity:0.5;text-align:center;padding:20px;">No referrals yet</div>';
  }

  async function loadBoard() {
    const { data: leaders, error } = await sb
.from('users')
.select('first_name, dtk_balance, id')
.order('dtk_balance', { ascending: false })
.limit(100);
    
    if (error) return;
    
    const list = document.getElementById('leaderList');
    list.innerHTML = leaders.map((u, i) => `
      <div class="leader-item">
        <div class="leader-rank">#${i + 1}</div>
        <div class="leader-name">
          ${u.first_name || 'User'}
          ${u.id === user.id? '<span class="you-badge">YOU</span>' : ''}
        </div>
        <div class="leader-bal">${u.dtk_balance.toLocaleString()} DTK</div>
      </div>
    `).join('');
  }

  function copyRef() {
    const link = `https://t.me/Denex_airdrop_bot/Denex?startapp=ref_${user.id}`;
    navigator.clipboard.writeText(link);
    tg.HapticFeedback.notificationOccurred('success');
    showPopup('Link Copied!');
  }

  function updateUI() {
    if (!userData) return;
    document.getElementById('dtkBalance').innerText = userData.dtk_balance.toLocaleString();
    document.getElementById('energyText').innerText = `Energy: ${userData.energy}/100`;
    document.getElementById('energyFill').style.width = `${userData.energy}%`;
    document.getElementById('refillBtn').style.display = userData.energy < 100? 'block' : 'none';
  }

  function showPopup(text) {
    const popup = document.getElementById('popup');
    popup.innerText = text;
    popup.classList.add('show');
    setTimeout(() => popup.classList.remove('show'), 2000);
  }

  function showFloatText(x, y) {
    const float = document.createElement('div');
    float.className = 'float-text';
    float.innerText = '+70';
    float.style.left = (x - 20) + 'px';
    float.style.top = (y - 20) + 'px';
    document.body.appendChild(float);
    setTimeout(() => float.remove(), 1000);
  }

  init();
</script>
</body>
</html>
